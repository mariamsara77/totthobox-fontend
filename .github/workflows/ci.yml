name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - adsense-seo-hardening
      - audit-hardening-2026
      - fix/sidebar-seo-mainline-2026

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --fetch-retries=5 --fetch-retry-mintimeout=2000 --fetch-retry-maxtimeout=30000

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
