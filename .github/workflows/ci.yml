name: CI

on:
  pull_request:
    branches: [main, refactor/perfect-ui-and-state]
  push:
    branches: [main, refactor/perfect-ui-and-state]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify runtime
        run: node --version && npm --version

      - name: Install dependencies
        run: npm ci --prefer-online --fetch-retries=5 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=20000

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
