name: ESLint Safe Auto Fix

on:
  push:
    branches:
      - fix/eslint-production
  workflow_dispatch:

permissions:
  contents: write

jobs:
  eslint-autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply ESLint safe autofixes
        run: npx eslint . --fix

      - name: Commit safe autofixes
        run: |
          if git diff --quiet; then
            echo "No ESLint autofixes were necessary."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: apply safe eslint autofixes"
          git push
