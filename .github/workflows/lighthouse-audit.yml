name: Lighthouse audit

on:
  push:
    branches:
      - fix/sidebar-seo-mainline-2026
    paths:
      - ".github/workflows/lighthouse-audit.yml"
      - "app/**"
      - "components/**"
      - "next.config.ts"
      - "public/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_URL: https://totthobox-fontend-git-fix-sidebar-seo-mainline-2026-totthobox.vercel.app
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for the latest branch preview
        shell: bash
        run: |
          for attempt in $(seq 1 36); do
            if curl -fsS "$TARGET_URL/sitemap.xml" -o /tmp/totthobox-sitemap.xml \
              && ! grep -q '<loc>https://totthobox.com/news/headlines</loc>' /tmp/totthobox-sitemap.xml; then
              echo "Branch preview reflects the sitemap and route-metadata fixes."
              exit 0
            fi
            echo "Waiting for the Vercel branch preview ($attempt/36)..."
            sleep 10
          done
          echo "Timed out waiting for the latest branch preview." >&2
          exit 1

      - name: Crawl every sitemap URL for status and SEO metadata
        id: route-seo-audit
        continue-on-error: true
        run: |
          node <<'NODE'
          (async () => {
          const fs = require("node:fs");
          const base = process.env.TARGET_URL.replace(/\/$/, "");
          const issues = [];
          const structural = [];
          const forbidden = /^\/(?:news(?:\/|$)|settings(?:\/|$)|messages(?:\/|$)|ai\/chat(?:\/|$)|offline(?:\/|$)|login$|register$|forgot-password$|reset-password$|api(?:\/|$))/i;

          const response = await fetch(`${base}/sitemap.xml`);
          if (!response.ok) throw new Error(`Sitemap returned HTTP ${response.status}`);
          const xml = await response.text();
          const urls = [...xml.matchAll(/<loc>(.*?)<\/loc>/g)].map((m) => m[1].trim());
          const unique = [...new Set(urls)];
          if (urls.length !== unique.length) structural.push({ type: "duplicate-url", count: urls.length - unique.length });

          for (const value of urls) {
            try {
              const parsed = new URL(value);
              if (parsed.origin !== "https://totthobox.com") structural.push({ type: "wrong-host", url: value });
              if (forbidden.test(parsed.pathname)) structural.push({ type: "non-public-url", url: value });
            } catch {
              structural.push({ type: "invalid-url", url: value });
            }
          }

          let cursor = 0;
          const inspect = async (loc) => {
            let parsed;
            try { parsed = new URL(loc); } catch { return; }
            const path = parsed.pathname + parsed.search;
            try {
              const res = await fetch(`${base}${path}`, { signal: AbortSignal.timeout(15000), redirect: "follow" });
              const html = await res.text();
              const getMeta = (pattern) => html.match(pattern)?.[1] || "";
              const title = getMeta(/<title>([\s\S]*?)<\/title>/i);
              const description = getMeta(/<meta\s+name=["']description["']\s+content=["']([^"']*)["']/i);
              const canonical = getMeta(/<link\s+rel=["']canonical["']\s+href=["']([^"']*)["']/i);
              const ogImage = getMeta(/<meta\s+property=["']og:image["']\s+content=["']([^"']*)["']/i);
              const twitterCard = getMeta(/<meta\s+name=["']twitter:card["']\s+content=["']([^"']*)["']/i);
              const twitterImage = getMeta(/<meta\s+name=["']twitter:image["']\s+content=["']([^"']*)["']/i);
              const robots = getMeta(/<meta\s+name=["']robots["']\s+content=["']([^"']*)["']/i);
              const h1 = (html.match(/<h1\b/gi) || []).length;
              if (res.status >= 400) issues.push({ type: "http", status: res.status, path });
              if (!title) issues.push({ type: "missing-title", path });
              if (!description) issues.push({ type: "missing-description", path });
              if (!canonical) issues.push({ type: "missing-canonical", path });
              else if (new URL(canonical, "https://totthobox.com").origin !== "https://totthobox.com") issues.push({ type: "canonical-host", path, canonical });
              if (!ogImage) issues.push({ type: "missing-og-image", path });
              if (!twitterCard || !twitterImage) issues.push({ type: "incomplete-twitter", path });
              if (/noindex/i.test(robots)) issues.push({ type: "noindex-in-sitemap", path, robots });
              if (h1 !== 1) issues.push({ type: "h1-count", path, count: h1 });
            } catch (error) {
              issues.push({ type: "fetch-error", path, message: String(error).slice(0, 180) });
            }
          };

          const worker = async () => {
            while (true) {
              const index = cursor++;
              if (index >= unique.length) return;
              await inspect(unique[index]);
            }
          };
          await Promise.all(Array.from({ length: 6 }, worker));

          const counts = {};
          for (const issue of issues) counts[issue.type] = (counts[issue.type] || 0) + 1;
          const result = { checkedAt: new Date().toISOString(), sitemapCount: urls.length, uniqueCount: unique.length, structural, issueCounts: counts, issues };
          fs.writeFileSync("route-seo-audit.json", JSON.stringify(result, null, 2));
          console.log(`Sitemap URLs: ${urls.length}; unique: ${unique.length}; structural issues: ${structural.length}`);
          console.log("Route issue counts:", JSON.stringify(counts));
          console.log("First 60 route issues:", JSON.stringify(issues.slice(0, 60), null, 2));
          })().catch((error) => { console.error(error); process.exitCode = 1; });
          NODE

      - name: Install Lighthouse CLI
        run: npm install --no-save lighthouse@12.8.2

      - name: Lighthouse — homepage, mobile
        run: npx lighthouse "$TARGET_URL/" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=lh-home-mobile.json --quiet

      - name: Lighthouse — homepage, desktop
        run: npx lighthouse "$TARGET_URL/" --preset=desktop --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=lh-home-desktop.json --quiet

      - name: Lighthouse — document converter, mobile
        run: npx lighthouse "$TARGET_URL/converter/document" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=lh-converter-mobile.json --quiet

      - name: Lighthouse — document converter, desktop
        run: npx lighthouse "$TARGET_URL/converter/document" --preset=desktop --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=lh-converter-desktop.json --quiet

      - name: Print score and Core Web Vitals summary
        if: always()
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const reports = [
            ["Homepage / mobile", "lh-home-mobile.json"],
            ["Homepage / desktop", "lh-home-desktop.json"],
            ["Converter / mobile", "lh-converter-mobile.json"],
            ["Converter / desktop", "lh-converter-desktop.json"],
          ];
          for (const [label, file] of reports) {
            if (!fs.existsSync(file)) {
              console.log(`${label}: report missing`);
              continue;
            }
            const r = JSON.parse(fs.readFileSync(file, "utf8"));
            const score = (key) => {
              const value = r.categories?.[key]?.score;
              return Number.isFinite(value) ? Math.round(value * 100) : "n/a";
            };
            const metric = (key) => r.audits?.[key]?.displayValue ?? "n/a";
            console.log(
              `${label}: Performance ${score("performance")}, Accessibility ${score("accessibility")}, Best Practices ${score("best-practices")}, SEO ${score("seo")}; LCP ${metric("largest-contentful-paint")}; CLS ${metric("cumulative-layout-shift")}; TBT ${metric("total-blocking-time")}`
            );
            const opportunities = Object.entries(r.audits || {})
              .filter(([, audit]) => audit.score !== null && audit.score < 0.9 && audit.details?.type === "opportunity")
              .sort((a, b) => a[1].score - b[1].score)
              .slice(0, 8);
            for (const [id, audit] of opportunities) {
              console.log(`  Opportunity ${id}: ${audit.title}; ${audit.displayValue || "no display value"}`);
            }
          }
          NODE

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: totthobox-lighthouse-reports
          path: |
            lh-*.json
            route-seo-audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish measured audit results
        if: always()
        shell: bash
        env:
          REPORT_PATH: docs/PRODUCTION_AUDIT_RESULTS_2026-10-11.md
        run: |
          mkdir -p docs
          node <<'NODE'
          const fs = require("node:fs");
          const path = process.env.REPORT_PATH;
          const lines = [
            "# Automated Production Audit Results",
            "",
            `- Generated: ${new Date().toISOString()}`,
            "- Branch: `fix/sidebar-seo-mainline-2026`",
            "- Target: branch Vercel preview; preview responses are expected to carry noindex headers.",
            "",
            "## Full sitemap route crawl",
          ];
          if (fs.existsSync("route-seo-audit.json")) {
            const r = JSON.parse(fs.readFileSync("route-seo-audit.json", "utf8"));
            lines.push(
              `- Sitemap URLs: ${r.sitemapCount}`,
              `- Unique URLs: ${r.uniqueCount}`,
              `- Structural findings: ${r.structural?.length ?? "n/a"}`,
              `- Route findings: ${r.issues?.length ?? "n/a"}`,
              "",
              "### Finding counts",
              "",
              "```json",
              JSON.stringify(r.issueCounts || {}, null, 2),
              "```",
              "",
              "### Structural findings",
              "",
              "```json",
              JSON.stringify((r.structural || []).slice(0, 100), null, 2),
              "```",
              "",
              "### First 100 route findings",
              "",
              "```json",
              JSON.stringify((r.issues || []).slice(0, 100), null, 2),
              "```",
            );
          } else {
            lines.push("- **NOT RUN:** route crawl did not produce a result file.", "");
          }
          lines.push("", "## Lighthouse — real Chrome runs", "");
          const reports = [
            ["Homepage / mobile", "lh-home-mobile.json"],
            ["Homepage / desktop", "lh-home-desktop.json"],
            ["Document converter / mobile", "lh-converter-mobile.json"],
            ["Document converter / desktop", "lh-converter-desktop.json"],
          ];
          for (const [label, file] of reports) {
            if (!fs.existsSync(file)) {
              lines.push(`- **${label}: NOT RUN / report missing**`);
              continue;
            }
            const r = JSON.parse(fs.readFileSync(file, "utf8"));
            const score = (key) => {
              const n = r.categories?.[key]?.score;
              return Number.isFinite(n) ? Math.round(n * 100) : "n/a";
            };
            const metric = (key) => r.audits?.[key]?.displayValue ?? "n/a";
            lines.push(
              `- **${label}:** Performance ${score("performance")}, Accessibility ${score("accessibility")}, Best Practices ${score("best-practices")}, SEO ${score("seo")}; LCP ${metric("largest-contentful-paint")}; CLS ${metric("cumulative-layout-shift")}; TBT ${metric("total-blocking-time")}`
            );
            const bad = Object.entries(r.audits || {})
              .filter(([, a]) => a.score !== null && a.score < 0.9 && a.details?.type === "opportunity")
              .sort((a, b) => a[1].score - b[1].score)
              .slice(0, 8);
            for (const [id, a] of bad) lines.push(`  - ${id}: ${a.title} — ${a.displayValue || "no display value"}`);
          }
          lines.push(
            "",
            "## Interpretation",
            "",
            "- These scores are measured for the preview URLs and this exact workflow run only; they are not production field data.",
            "- A route crawl finding count of zero does not prove that every possible dynamic slug exists; it only covers the URLs currently published in the sitemap.",
            "- Do not mark WCAG 2.2 AA, offline/install/update lifecycle, GA4 DebugView, or AdSense account/CMP readiness complete from this file alone.",
            ""
          );
          fs.writeFileSync(path, lines.join("\n"));
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REPORT_PATH"
          if git diff --cached --quiet; then
            echo "Audit results unchanged; no commit needed."
          else
            git commit -m "audit: publish automated route and Lighthouse results"
            # Rebase generated results onto any report/docs commit pushed while this run was auditing.
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
