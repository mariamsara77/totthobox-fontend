name: Normalize zinc UI

on:
  push:
    branches:
      - refactor/perfect-ui-and-state

permissions:
  contents: write

jobs:
  normalize:
    if: "!contains(github.event.head_commit.message, '[ui-normalized]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/perfect-ui-and-state
          fetch-depth: 0

      - name: Normalize UI classes
        shell: python
        run: |
          from pathlib import Path
          import re

          roots = [Path('app'), Path('components'), Path('lib')]
          extensions = {'.tsx', '.ts', '.jsx', '.js', '.css'}

          replacements = [
              (r'bg-zinc-950(?:/\d+)?', 'bg-zinc-400/10'),
              (r'bg-zinc-900(?:/\d+)?', 'bg-zinc-400/10'),
              (r'bg-zinc-800(?:/\d+)?', 'bg-zinc-400/10'),
              (r'bg-zinc-700(?:/\d+)?', 'bg-zinc-400/25'),
              (r'bg-zinc-600(?:/\d+)?', 'bg-zinc-400/25'),
              (r'hover:bg-zinc-950(?:/\d+)?', 'hover:bg-zinc-400/25'),
              (r'hover:bg-zinc-900(?:/\d+)?', 'hover:bg-zinc-400/25'),
              (r'hover:bg-zinc-800(?:/\d+)?', 'hover:bg-zinc-400/25'),
              (r'hover:bg-zinc-700(?:/\d+)?', 'hover:bg-zinc-400/25'),
              (r'dark:bg-zinc-[456789]\d*(?:/\d+)?', 'bg-zinc-400/10'),
              (r'border-zinc-[56789]\d*(?:/\d+)?', 'border-zinc-400/25'),
              (r'dark:border-zinc-[56789]\d*(?:/\d+)?', 'border-zinc-400/25'),
              (r'rounded-lg', 'rounded-xl'),
              (r'rounded-md', 'rounded-xl'),
              (r'focus:ring-[^\s"\']+', ''),
              (r'focus:border-[^\s"\']+', ''),
              (r'\b(?:bg|hover:bg)-(?:blue|indigo|red|green|orange|amber|yellow|purple|pink|cyan|teal)-\d+(?:/\d+)?', 'bg-zinc-400/25'),
              (r'\b(?:text|hover:text)-(?:blue|indigo|red|green|orange|amber|yellow|purple|pink|cyan|teal)-\d+(?:/\d+)?', 'opacity-50'),
              (r'\b(?:border|hover:border)-(?:blue|indigo|red|green|orange|amber|yellow|purple|pink|cyan|teal)-\d+(?:/\d+)?', 'border-zinc-400/25'),
          ]

          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if path.suffix not in extensions or '.next' in path.parts:
                      continue
                  try:
                      original = path.read_text(encoding='utf-8')
                  except (UnicodeDecodeError, OSError):
                      continue
                  updated = original
                  for pattern, replacement in replacements:
                      updated = re.sub(pattern, replacement, updated)
                  updated = re.sub(r'\s{2,}', ' ', updated) if path.suffix == '.css' else updated
                  if updated != original:
                      path.write_text(updated, encoding='utf-8')

      - name: Commit normalized UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components lib
          if git diff --cached --quiet; then
            echo "No UI normalization changes required."
            exit 0
          fi
          git commit -m "chore(ui): normalize zinc styles [ui-normalized]"
          git push origin HEAD:refactor/perfect-ui-and-state
